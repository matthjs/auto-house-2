name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Formatting (ruff format)
        run: uv run ruff format --check .
      - name: Lint (ruff check)
        run: uv run ruff check .
      - name: Tests (offline)
        run: uv run pytest
