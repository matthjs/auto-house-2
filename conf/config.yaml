# Main config. Override anything on the command line, for example:
#   uv run python main.py profile=<you> site=flatfox llm=claude mode=confirm
# Show the final config without running: add --cfg job

defaults:
  - profile: ???          # conf/profile/<you>.yaml (or AUTO_HOUSE_PROFILE in .env)
  - llm: deepseek         # conf/llm/: deepseek, openai, claude
  - site: null            # conf/site/: wgzimmer, flatfox, wohnen_ethz (needed for command=run)
  - _self_
  - override hydra/job_logging: none
  - override hydra/hydra_logging: none

# run: search a site and handle new listings
# status: show what happened to each listing
# check-llm: one small paid call to test the API key and model
command: run

# dry-run: draft only, never send. confirm: ask before each send.
# auto: send drafts that pass review, at most max_sends per run.
mode: dry-run
max_sends: 5
# Lowest fit score (0-100) to apply at.
min_fit: 60

# Listing records go to <data_dir>/<profile_name>/<site>/.
data_dir: data
profile_name: ${hydra:runtime.choices.profile}
verbose: false

# No per-run output folders, and stay in the repository directory.
hydra:
  output_subdir: null
  run:
    dir: .
  job:
    chdir: false
