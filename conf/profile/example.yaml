# Copy to conf/profile/<you>.yaml (make new-profile PROFILE=<you>) and fill it in.
# Your profile files are git-ignored; only this example is tracked.
# Passwords and API keys never go here: they belong in .env.

# Who you are. The agent only uses facts from here, so the more, the better.
description:
  Name: ""
  Nationality: ""
  Age: ""
  Occupation: ""
  Languages_spoken: ""
  Phone_number: ""
  Email: ""
  LinkedIn_profile: ""
  My_blog: ""
  Likes: ""
  Lifestyle: ""

# What you are looking for.
preferences:
  budget_upper_bound: null   # maximum rent in CHF (required)
  place: ""                  # city for Flatfox and wohnen.ethz.ch, e.g. Zürich
  place_wg_zimmer: ""        # region value from wgzimmer.ch's search form
  move_in_date: ""
  nice_to_haves: ""
  deal_breakers: ""
