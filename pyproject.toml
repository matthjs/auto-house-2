[project]
name = "auto-house"
version = "0.2.0"
description = "An LLM agent that finds housing listings in Zurich and drafts personalised applications."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=2.8.0",
    "openai>=3.49.0",
    "pydantic>=2.14.3",
    "requests>=2.34.2",
    "selenium>=4.52.0",
    "setuptools>=84.2.1",
    "undetected-chromedriver>=3.5.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: hits real websites or paid LLM APIs; needs secrets (run with: uv run pytest -m live)",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
